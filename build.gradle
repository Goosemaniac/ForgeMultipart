//version: 1707058017

plugins {
    id 'com.gtnewhorizons.gtnhconvention'
}

// Pinned release version. `gtnh.modules.gitVersion` is disabled in gradle.properties, so the convention takes
// project.version from this property instead of deriving it from git tags. Without a tag in the clone the
// derivation fails and silently falls back to "NO-GIT-TAG-SET"; this keeps the artifact, the generated
// codechicken.multipart.Tags.VERSION field and mcmod.info at a fixed, meaningful version.
// Bump this line when preparing a release, and tag the release commit to match.
ext.modVersion = '2.0.2'
// Belt and braces: if git versioning were ever re-enabled, this keeps project.version on the pinned value.
version = ext.modVersion

tasks.test {
    useJUnitPlatform()
    testLogging {
        events("failed")
        exceptionFormat = "full"
    }
    // Gradle prints nothing on success, so a green run never says how much ran.
    afterSuite { desc, result ->
        if (desc.parent != null) {
            return
        }
        def summary = "Unit tests: ${result.testCount} tests, ${result.successfulTestCount} passed, " +
            "${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
        logger.lifecycle(summary)
        def stepSummary = System.getenv("GITHUB_STEP_SUMMARY")
        if (stepSummary) {
            new File(stepSummary) << "### ${summary}\n"
        }
    }
}

tasks.named('compileScala') {
    // Zinc does not invalidate joint-compiled Java annotations when Tags.VERSION changes.
    scalaCompileOptions.force = true
}
